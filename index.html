.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.danger{background:#713d49}

</head>

<script>

let items;try{items=JSON.parse(localStorage.getItem("myNavItems"))||defaults}catch(e){items=defaults}

function render(){

 groups.forEach(g=>{

   a.append(em,n,u);
   const b=document.createElement("button");b.className="edit";b.type="button";b.textContent="鉁�";b.onclick=e=>{e.preventDefault();e.stopPropagation();openEdit(x._i)};a.appendChild(b);
   grid.appendChild(a);
  });
 });
}
function openEdit(i=-1){editIndex=i;const x=i<0?{name:"",url:"https://",category:"甯哥敤缃戠珯",icon:"馃敆"}:items[i];$("dlgTitle").textContent=i<0?"娣诲姞缃戝潃":"缂栬緫缃戝潃";$("name").value=x.name;$("url").value=x.url;$("category").value=x.category;$("icon").value=x.icon||"";$("delete").style.display=i<0?"none":"inline-block";dlg.showModal()}
$("entryForm").onsubmit=e=>{e.preventDefault();const x={name:$("name").value.trim(),url:$("url").value.trim(),category:$("category").value.trim()||"鏈垎绫�",icon:$("icon").value.trim()||"馃敆"};if(!/^https?:\/\//i.test(x.url)){alert("缃戝潃蹇呴』浠� http:// 鎴� https:// 寮€澶�");return}if(editIndex<0)items.push(x);else items[editIndex]=x;save();dlg.close();render()};
$("delete").onclick=()=>{if(editIndex>=0&&confirm("纭畾鍒犻櫎杩欎釜缃戝潃鍚楋紵")){items.splice(editIndex,1);save();dlg.close();render()}};

$("importBtn").onclick=()=>$("importFile").click();
$("importFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());const arr=Array.isArray(d)?d:d.items;if(!Array.isArray(arr))throw 0;items=arr;cols=Number(d.cols)||4;save();$("columns").textContent="鍒楁暟锛�"+cols;render();alert("瀵煎叆鎴愬姛")}catch(err){alert("澶囦唤鏂囦欢鏍煎紡涓嶆纭�")}e.target.value=""};
